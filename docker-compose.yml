services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_DB: rustflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rustflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:change_me_strong_password@db:5432/rustflow
      RUSTFLOW_LLM_API_KEY: "${RUSTFLOW_LLM_API_KEY:-}"
      RUSTFLOW_LLM_ENDPOINT: "${RUSTFLOW_LLM_ENDPOINT:-}"
      RUSTFLOW_ADMIN_TOKEN: "${RUSTFLOW_ADMIN_TOKEN:-}"
      VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
    ports:
      - "3000:3000"

volumes:
  pgdata:
