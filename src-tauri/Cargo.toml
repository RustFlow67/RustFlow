[package]
name = "rustflow"
version = "0.1.0"
description = "RustFlow — нативный десктопный оптимизатор, диагностика ПК и твикер для Rust"
authors = ["RustFlow"]
edition = "2021"

[lib]
name = "rustflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
wmi = "0.18"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
